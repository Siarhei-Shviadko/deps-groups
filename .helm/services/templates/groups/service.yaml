apiVersion: v1
kind: Service
metadata:
  name: groups
  labels:
    {{- include "deps-groups.labels" . | nindent 4 }}
spec:
  type: {{ .Values.groups.service.type }}
  ports:
    - port: {{ .Values.groups.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-groups.selectorLabels" . | nindent 4 }}
