groups:
  image:
    path: "/deps-platform/deps-groups"
  resources: {}

groups_settings:
  ENV: ds

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

groups_consumer:
  image:
    path: "/deps-platform/deps-groups"

migrator:
  image:
    path: "/deps-platform/deps-groups-migrator"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-ds'
  roleName: 'k8s-ds'
  vaultKubernetesMountPath: 'kubernetes-ds'

service_account:
  serviceAccountName: 'deps-ds'
